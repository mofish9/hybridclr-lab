name: DHE CSharp Host Validation

on:
  workflow_dispatch:

jobs:
  host:
    # Unity/Xcode/native runtime validation remains an environment gate. This
    # job verifies that the cross-platform C# tool can be built and distributed
    # on the dedicated runner; platform Player lanes add their own adapter.
    runs-on: [self-hosted, windows, dhe-tuanjie]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build C# DHE host
        shell: bash
        run: dotnet build HybridCLR.Lab.sln --configuration Release --ignore-failed-sources

      - name: Publish C# DHE toolchain
        shell: bash
        run: >-
          dotnet run --project tool/HybridCLR.DheTool.csproj --configuration Release --no-restore --
          publish -LabRoot . -OutputRoot artifacts/dhe-toolchain -Mode Exploratory -ForceOutput

      - name: Verify C# DHE toolchain
        shell: bash
        run: >-
          dotnet run --project tool/HybridCLR.DheTool.csproj --configuration Release --no-restore --
          verify-package -PackageRoot artifacts/dhe-toolchain

      - name: Upload host report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dhe-csharp-host-report
          path: artifacts/dhe-toolchain/**
